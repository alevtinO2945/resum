    <script>
        // Data for icons and windows
        const desktopItems = [

                content: `
                    <div class="tab-container">

            },
            {
                id: 'projects',

                icon: "{{ url_for('static', filename='images/briefcase.png') }}",
                content: `
                    <div class="project">
                        <h3>Semantic Book Recommender System</h3>

                        <p>A book recommendation system leveraging large language models. The system transforms book descriptions into mathematical representations to enable precise content-based matching. Key features include sentiment analysis, categorization of books, and a dashboard for recommendations.</p>
                    </div>
                `
            },
            {
                id: 'education',
                title: 'Education',
                icon: "{{ url_for('static', filename='images/WMP-library.png') }}",
                content: `
                    <h3>University</h3>
                    <p>Vinnytsia National Technical University</p>

                    <p>Education level: bachelor</p>
                    <p>2023-2027</p>

                    <h3>College</h3>
                    <p>Mykolaiv Polytechnic Vocational College</p>
                    <p>Computer engineering</p>
                    <p>Education level: junior bachelor</p>
                    <p>2021-2023</p>
                `
            },
            {
                id: 'activities',
                title: 'Activities',
                icon: "{{ url_for('static', filename='images/internet-shortcut.png') }}",
                content: `
                    <h4>Student of the Vinnytsia Challenge Startup School of the Sikorsky Challenge Ukraine network 19/03/25 - now</h4>
                    <p>I'm part of a team that develops its startup idea from scratch to result with the support of mentors</p>

                    <p>My first volunteering experience abroad, where I had experience in construction, gardening and cooking for the House of Solidarity with participants from
all over Europe.</p>

I parsed data on 5000 houses and built a machine learning model that gave house recommendations according to the house the user was viewing.</p>

                    <p>At this eco-camp, I learned more about the European Green Deal and implemented a garden therapy event with the team in Stryiskyi Park in Lviv. During the day of all the events, more than 100 people were involved.</p>

                    <p>The main objective of the project was intercultural exchange and knowledge about the European Union, deepening the connection with European values.</p>

                    <p>My teammate and I have developed a self-propelled device with a claw that can be used as a grabbing element. I wrote the code to control the device through a gamepad.</p>
                `
            },
            {
                id: 'languages',
                title: 'Languages',
                icon: "{{ url_for('static', filename='images/font-similarity-view.png') }}",
                content: `
                    <ul class="language-list">
                        <li class="language-item">Ukrainian - native</li>
                        <li class="language-item">English - B2</li>
                        <li class="language-item">Russian - fluent</li>
                        <li class="language-item">French — A2</li>
                        <li class="language-item">Japanese — N4</li>
                    </ul>
                `
            },
            {
                id: 'game',
                title: 'Mini-game',
                icon: "{{ url_for('static', filename='images/recycle-bin-empty.png') }}",
                content: `
                    <div class="game-container">
                        <canvas id="gameCanvas" class="game-canvas" width="400" height="300"></canvas>
                        <div class="game-score">Score: 0</div>
                    </div>
                `
            }
        ];

        // Loading screen
        window.onload = function() {
            const progress = document.querySelector('.progress');
            progress.style.width = '100%';

            setTimeout(() => {
                document.querySelector('.loading-screen').style.display = 'none';
                showWelcomeMessage();
            }, 1500);
        };

        // Show welcome window
        function showWelcomeMessage() {
            const window = createWindow('welcome', '👋👋👋', `
                <div style="padding: 20px;">
                    <h2>Hi!</h2>
                    <p>This resume has the same information as the text version, but it has a little interactivity and is designed in my favorite aesthetic. </p>
                    <p>You can find the text version of the resume in the “Contacts” menu.</p>
                    <p>Here is a picture of the cats because everyone likes them.</p>
                    <img width="100%" height="50%" src="{{ url_for('static', filename='images/cats.jpg') }}" alt="cats">
                </div>
            `);
            showWindow(window, '50%', '50%');
        }

        // Create window
        function createWindow(id, title, content) {
            let window = document.createElement('div');
            window.className = 'window';
            window.id = id;
            window.innerHTML = `
                <div class="title-bar">
                    <div class="title-bar-text">${title}</div>
                    <div class="title-bar-controls">
                        <button aria-label="Minimize"></button>
                        <button aria-label="Maximize"></button>
                        <button aria-label="Close" onclick="this.closest('.window').style.display='none'"></button>
                    </div>
                </div>
                <div class="window-body">${content}</div>
            `;

            // Add window dragging functionality
            makeDraggable(window);

            document.body.appendChild(window);
            return window;
        }

        // Show window
        function showWindow(window, x, y) {
            window.style.display = 'block';
            window.style.left = x;
            window.style.top = y;
            if (x === '50%' && y === '50%') {
                window.style.transform = 'translate(-50%, -50%)';
            }
        }

        // Function for dragging windows
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const titleBar = element.querySelector('.title-bar');
            titleBar.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                // Store the initial mouse position relative to the window
                const rect = element.getBoundingClientRect();
                pos1 = e.clientX - rect.left;
                pos2 = e.clientY - rect.top;

                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;

                // Bring window to front
                const windows = document.querySelectorAll('.window');
                windows.forEach(w => w.style.zIndex = '1');
                element.style.zIndex = '2';
            }

            function elementDrag(e) {
                e.preventDefault();
                // Calculate new position based on initial mouse offset
                element.style.left = `${e.clientX - pos1}px`;
                element.style.top = `${e.clientY - pos2}px`;
                element.style.transform = 'none';
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // Add icons to desktop
        const desktop = document.querySelector('.desktop');
        desktopItems.forEach((item, index) => {
            const icon = document.createElement('div');
            icon.className = 'desktop-icon';
            icon.draggable = true;

            // Positioning logic remains the same as previous solution
            if (item.id === 'game') {
                icon.style.right = '20px';
                icon.style.bottom = '50px';
                icon.style.left = 'auto';
                icon.style.top = 'auto';
            } else {
                icon.style.left = `${20 + (index % 3) * 100}px`;
                icon.style.top = `${20 + Math.floor(index / 3) * 100}px`;
            }

            icon.innerHTML = `
                <img src="${item.icon}" alt="${item.title}">
                <div>${item.title}</div>
            `;

            let isDragging = false;
            let isMouseDown = false;
            let clickCount = 0;
            let clickTimer = null;

            icon.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                clickCount++;

                // Reset click count if too much time has passed
                if (clickTimer) clearTimeout(clickTimer);
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                }, 300);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;

                // Start dragging after a small movement threshold
                if (!isDragging) {
                    const dx = Math.abs(e.movementX);
                    const dy = Math.abs(e.movementY);
                    if (dx > 3 || dy > 3) {
                        isDragging = true;
                        clickCount = 0;
                    }
                }

                if (isDragging) {
                    const x = e.clientX - icon.offsetWidth / 2;
                    const y = e.clientY - icon.offsetHeight / 2;

                    const maxX = desktop.offsetWidth - icon.offsetWidth;
                    const maxY = desktop.offsetHeight - icon.offsetHeight;

                    icon.style.left = `${Math.max(0, Math.min(x, maxX))}px`;
                    icon.style.top = `${Math.max(0, Math.min(y, maxY))}px`;
                }
            });

            icon.addEventListener('mouseup', (e) => {
                if (!isDragging && clickCount === 2) {
                    // Open window on double-click
                    const existingWindow = document.getElementById(item.id);
                    if (existingWindow) {
                        existingWindow.style.display = 'block';
                    } else {
                        const window = createWindow(item.id, item.title, item.content);
                        showWindow(window, '50%', '50%');

                        if (item.id === 'game') {
                            initGame();
                        } else if (item.id === 'skills') {
                            initSkillsTabs();
                        }
                    }
                }

                // Reset states
                isDragging = false;
                isMouseDown = false;
            });

            document.addEventListener('mouseup', () => {
                isMouseDown = false;
                isDragging = false;
            });

            desktop.appendChild(icon);
        });

        // Fix for skills tabs
        function initSkillsTabs() {
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');

                    // Update active tab
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    // Update active content
                    tabContents.forEach(content => {
                        if (content.getAttribute('data-tab') === tabId) {
                            content.classList.add('active');
                        } else {
                            content.classList.remove('active');
                        }
                    });
                });
            });
        }

        // Contact menu functionality
        const contactButton = document.querySelector('.contact-button');
        const contactMenu = document.querySelector('.contact-menu');

        contactButton.addEventListener('click', () => {
            contactMenu.style.display = contactMenu.style.display === 'none' ? 'block' : 'none';
        });

        document.addEventListener('click', (e) => {
            if (!contactButton.contains(e.target) && !contactMenu.contains(e.target)) {
                contactMenu.style.display = 'none';
            }
        });

        // Mini-game
        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.querySelector('.game-score');
            let score = 0;
            let gameSpeed = 2;

            const bin = {
                x: canvas.width / 2 - 25,
                y: canvas.height - 50,
                width: 50,
                height: 50,
                speed: 5
            };

            const trash = {
                x: Math.random() * (canvas.width - 20),
                y: 0,
                width: 20,
                height: 20,
                speed: gameSpeed
            };

            function drawBin() {
                ctx.fillStyle = '#666';
                ctx.fillRect(bin.x, bin.y, bin.width, bin.height);
                // Add details to the bin
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(bin.x, bin.y, bin.width, bin.height);
            }

            function drawTrash() {
                ctx.fillStyle = '#833';
                ctx.beginPath();
                ctx.arc(trash.x + trash.width/2, trash.y + trash.height/2, trash.width/2, 0, Math.PI * 2);
                ctx.fill();
            }

            function updateScore() {
                scoreElement.textContent = `Score: ${score}`;
            }

            function resetTrash() {
                trash.y = 0;
                trash.x = Math.random() * (canvas.width - trash.width);
            }

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                bin.x = Math.max(0, Math.min(x - bin.width/2, canvas.width - bin.width));
            });

            function gameLoop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                trash.y += trash.speed;

                // Check for collision
                if (trash.y + trash.height > bin.y &&
                    trash.x + trash.width > bin.x &&
                    trash.x < bin.x + bin.width &&
                    trash.y < bin.y + bin.height) {
                    score++;
                    trash.speed += 0.2;
                    updateScore();
                    // Reset trash position
                    resetTrash();
                }

                // If trash has fallen past the bin
                if (trash.y > canvas.height) {
                    // Reset score and speed when trash is missed
                    score = 0;
                    trash.speed = gameSpeed;
                    updateScore();
                    resetTrash();
                }

                drawBin();
                drawTrash();

                // Check if game window is still open
                const gameWindow = document.getElementById('game');
                if (gameWindow && gameWindow.style.display !== 'none') {
                    requestAnimationFrame(gameLoop);
                }
            }

            gameLoop();
        }

        // Close context menu when clicking outside
        document.addEventListener('click', (e) => {
            const startMenu = document.querySelector('.start-menu');
            if (startMenu && !e.target.closest('.start-button') && !e.target.closest('.start-menu')) {
                startMenu.style.display = 'none';
            }
        });

        // Hotkey handling
        document.addEventListener('keydown', (e) => {
            // Alt + Tab to switch between windows
            if (e.altKey && e.key === 'Tab') {
                e.preventDefault();
                const windows = Array.from(document.querySelectorAll('.window')).filter(w => w.style.display !== 'none');
                if (windows.length > 1) {
                    const activeWindow = document.querySelector('.window[style*="z-index: 2"]');
                    const nextWindow = windows[(windows.indexOf(activeWindow) + 1) % windows.length];
                    windows.forEach(w => w.style.zIndex = '1');
                    nextWindow.style.zIndex = '2';
                }
            }
        });

        // General handler for closing windows and menus when clicking on desktop
        desktop.addEventListener('click', (e) => {
            if (e.target === desktop) {
                const contactMenu = document.querySelector('.contact-menu');
                if (contactMenu) {
                    contactMenu.style.display = 'none';
                }
            }

        // Add some CSS to style the tabs
        const style = document.createElement('style');
        style.textContent = `
            .tab-container {
                display: flex;
                border-bottom: 1px solid #999;

            .tab {

            .tab-content.active {

            }
            .desktop {
                background-image: url("{{ url_for('static', filename='images/azul.png') }}");
                background-size: cover;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 40px;
                overflow: hidden;
            }
            .taskbar {
                background: linear-gradient(to bottom, #245edb, #3a6edb, #245edb);
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 40px;
                display: flex;
                align-items: center;
                padding: 0 10px;
            }


            .desktop-icon {
                position: absolute;
                width: 80px;
                height: 80px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: white;
                text-shadow: 1px 1px 1px black;
                cursor: pointer;
            }
            .desktop-icon img {
                width: 48px;
                height: 48px;
                margin-bottom: 5px;
            }
            .desktop-icon div {
                text-align: center;
                font-size: 14px;
                word-wrap: break-word;
                width: 100%;
            }
            .contact-button {
                display: flex;
                align-items: center;
                background: transparent;
                border: none;
                color: white;
                cursor: pointer;
                padding: 5px 10px;
            }
            .contact-button:hover {
                background: rgba(255, 255, 255, 0.2);
            }
            .contact-menu {
                display: none;
                position: absolute;
                bottom: 40px;
                left: 10px;
                background: white;
                border: 1px solid #ccc;
                box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
                z-index: 1000;
            }
            .contact-menu-item {
                padding: 8px 12px;
                display: flex;
                align-items: center;
                cursor: pointer;
            }
            .contact-menu-item:hover {
                background: #e5f3ff;
            }
            .contact-menu-item img {
                width: 16px;
                height: 16px;
                margin-right: 8px;
            }
            .window {
                position: absolute;
                background: #ece9d8;
                border: 1px solid #0078d7;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
                min-width: 300px;
                min-height: 200px;
                display: none;
                resize: both;
                overflow: auto;
            }
            .game-container {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .game-canvas {
                border: 1px solid #999;
                margin-bottom: 10px;
                background-color: #f0f0f0;
            }
            .game-score {
                font-weight: bold;
            }
        `;
        document.head.appendChild(style);
    </script>
